name: Release

on:
  push:
    branches: [develop]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.5'

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          custom_release_rules: >-
            breaking:major,
            feat:minor,
            fix:patch,chore:patch,perf:patch,refactor:patch,docs:patch,style:patch,test:patch

      - name: Create GitHub release
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

  build-android:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-and-release.outputs.new_tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # No release keystore is configured yet, so this ships signed with the
      # Flutter debug key (see android/app/build.gradle.kts). Good enough to
      # sideload for testing; swap in a real keystore before a Play Store release.
      - run: flutter build apk --release

      - name: Rename APK with version tag
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/spendly-${{ needs.tag-and-release.outputs.new_tag }}-android.apk"

      - name: Attach APK to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag-and-release.outputs.new_tag }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifacts: dist/*.apk

  # No iOS build job: a real device-installable .ipa needs an Apple
  # Developer distribution certificate + provisioning profile. A free
  # Apple ID's signing only lasts 7 days and is tied to an interactive
  # Xcode session on one machine, so it can't be handed to a stateless
  # GitHub Actions runner without re-generating and re-uploading secrets
  # every week — not something a CI pipeline can do unattended. Revisit
  # this once a paid Apple Developer Program membership is available.
